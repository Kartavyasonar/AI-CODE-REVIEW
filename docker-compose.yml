version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MEMORY_DB_DIR=/app/memory_db
      - FRONTEND_URL=http://localhost:3000
      - PORT=8000
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_TELEMETRY=false
      # Optional: API_SECRET=${API_SECRET}
    volumes:
      - memory_store:/app/memory_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # give the ML models time to load on first start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy   # wait for backend healthcheck to pass
    restart: unless-stopped

volumes:
  memory_store:
    driver: local
